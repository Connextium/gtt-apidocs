name: Update & Build GTT API Docs

on:
  schedule:
    # Run daily at 00:00 UTC to sync upstream OpenAPI changes
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI
  push:
    branches: [ main, master ]
    paths:
      - 'index.html'
      - 'src/**'
      - 'scripts/**'
      - 'openapi/**'

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Fetch Latest OpenAPI Spec & Build Static Docs
        run: |
          npm run fetch-spec
          npm run build

      - name: Commit & Push Changes if Spec Updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add openapi/ dist/
          if git diff --staged --quiet; then
            echo "No changes detected in OpenAPI spec or build output."
          else
            git commit -m "chore(docs): auto-sync OpenAPI spec and rebuild static docs"
            git push
          fi
