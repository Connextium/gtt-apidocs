<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTT Business Client API Documentation</title>
  <meta name="description"
    content="Interactive and Reference OpenAPI Documentation for Global Trade Treasury Business Client API">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="src/styles.css">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>">
</head>

<body>
  <div class="app-container">
    <!-- Top Navigation & Switcher Header -->
    <header class="app-header">
      <div class="header-left">
        <a href="#" class="logo-wrapper" title="Global Trade Treasury">
          <div class="logo-icon">G</div>
          <div class="brand-info">
            <div class="brand-title">
              GTT Business Client API
              <span id="api-version" class="badge">v0.1.0</span>
              <span id="endpoint-count" class="badge badge-endpoint-count">19 Endpoints</span>
            </div>
            <div class="brand-subtitle">Global Trade Treasury • Interactive Developer Portal</div>
          </div>
        </a>
      </div>

      <!-- Center: Dual Viewer Mode Switcher -->
      <div class="header-center">
        <div class="segmented-control" role="tablist" aria-label="Viewer Style">
          <button id="btn-view-scalar" class="segment-btn active" role="tab" aria-selected="true"
            title="Modern - Interactive API client with testing console">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 3 19 12 5 21 5 3" />
            </svg>
            <span>Modern</span>
          </button>
          <button id="btn-view-redoc" class="segment-btn" role="tab" aria-selected="false"
            title="Classic - Clean 3-panel enterprise reference specification">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
              <line x1="9" y1="3" x2="9" y2="21" />
            </svg>
            <span>Classic</span>
          </button>
        </div>
      </div>

      <!-- Right: Actions & Theme Toggle -->
      <div class="header-right">
        <span class="badge badge-live" title="Live OpenAPI sync enabled">Live Spec</span>

        <button id="btn-copy-url" class="action-btn" title="Copy live OpenAPI JSON URL">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
          </svg>
          <span>Copy URL</span>
        </button>

        <button id="btn-download-spec" class="action-btn" title="Download OpenAPI JSON Spec">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          <span>Download JSON</span>
        </button>

        <button id="theme-toggle-btn" class="action-btn icon-btn" title="Switch to Dark Mode" aria-label="Toggle Theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>

        <button id="btn-ask-ai" class="action-btn" title="Ask AI about this API">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path
              d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" />
          </svg>
          <span>Ask GTT AI</span>
        </button>

      </div>
    </header>

    <!-- Main Content Area (Split View: Docs + Parallel AI Panel) -->
    <div class="app-body-wrapper">
      <!-- Main Viewports Area -->
      <main class="viewports-wrapper">
        <!-- Loading State -->
        <div id="loading-overlay" class="loading-overlay">
          <div class="spinner"></div>
          <p style="color: var(--text-secondary); font-size: 0.9rem; font-weight: 500;">Loading GTT Business Client API Documentation...</p>
        </div>

        <!-- Scalar Container -->
        <div id="pane-scalar" class="viewer-pane active" role="tabpanel" aria-label="Scalar Documentation"></div>

        <!-- Redoc Container -->
        <div id="pane-redoc" class="viewer-pane" role="tabpanel" aria-label="Redoc Documentation"></div>
      </main>

      <!-- Ask AI Parallel Side Panel -->
      <aside id="ai-modal" class="ai-side-panel" aria-label="GTT AI Assistant">
        <div class="ai-panel-header">
          <div class="ai-panel-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" />
            </svg>
            <span>Ask GTT AI Assistant</span>
          </div>
          <button id="ai-modal-close" class="action-btn icon-btn ai-close-btn" title="Close Panel (Esc)" aria-label="Close panel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>

        <div class="ai-panel-body">
          <div class="ai-input-wrapper">
            <input type="text" id="ai-query-input"
              placeholder="Ask about endpoints, authentication, USDC payins, schemas..." autocomplete="off" />
            <button id="ai-submit-btn" class="ai-submit-btn" title="Send question">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="22" y1="2" x2="11" y2="13" />
                <polygon points="22 2 15 22 11 13 2 9 22 2" />
              </svg>
            </button>
          </div>

          <!-- Quick Suggestion Chips -->
          <div class="ai-suggestions">
            <span class="ai-suggestion-label">Suggested:</span>
            <button class="ai-chip" data-query="How do I authenticate with the API?">Authentication</button>
            <button class="ai-chip" data-query="How to create a USDC payin funding instruction?">USDC Payin</button>
            <button class="ai-chip" data-query="How do I rotate an API key?">Rotate API Key</button>
            <button class="ai-chip" data-query="What onboarding endpoints are available?">Onboarding</button>
          </div>

          <!-- Response Container -->
          <div id="ai-result-container" class="ai-result-container" style="display: none;">
            <div class="ai-result-header">
              <span class="ai-result-badge">AI Response</span>
              <button id="btn-copy-ai-answer" class="ai-copy-btn" title="Copy Answer">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                </svg>
                <span>Copy</span>
              </button>
            </div>
            <div id="ai-response-content" class="ai-response-content"></div>
          </div>
        </div>
      </aside>
    </div>

    <!-- Toast Feedback -->
    <div id="toast" class="toast" role="status" aria-live="polite">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5">
        <polyline points="20 6 9 17 4 12" />
      </svg>
      <span id="toast-msg">Notification</span>
    </div>
  </div>

  <!-- Documentation Engines -->
  <script src="https://cdn.jsdelivr.net/npm/redoc@latest/bundles/redoc.standalone.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>

  <!-- App Controller -->
  <script src="src/app.js"></script>
</body>

</html>
